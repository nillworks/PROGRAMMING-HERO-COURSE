<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
</head>

<style>
  .filed img {
    transition: 0.5s;
  }

  .field:hover img {
    transform: rotate(-90deg);
  }

  .bol {
    width: 40px;
    height: 40px;
    background-color: red;
    border-radius: 40px;
  }
</style>

<body>


  <div class="field">
    <img src="bat.png" alt="">
    <div class="bol"></div>
  </div>


</body>

</html>
