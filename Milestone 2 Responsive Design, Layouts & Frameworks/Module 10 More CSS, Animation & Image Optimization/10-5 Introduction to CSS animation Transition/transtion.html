<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      background-color: pink;
      color: white;
      font-weight: bold;
      border-radius: 10px;

      transition: width 5s linear 3s, background-color 5s linear;
    }

    .box:hover {
      width: 200px;
    }
  </style>
</head>

<body>



  <div class="box">box - 1</div>
  <div class="box">box - 2</div>
  <div class="box">box - 3</div>
  <div class="box">box - 4</div>
  <div class="box">box - 5</div>

</body>

</html>
