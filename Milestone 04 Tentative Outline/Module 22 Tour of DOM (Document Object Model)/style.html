    // console.log(listCollection);
    for (const list of listCollection) {

    }

    const allHeadings = document.getElementsByTagName('h2') // স্পেসিফিক ট্যাগকে ধরার জন্য।
    for (const heading of allHeadings) {

      // console.log(heading.innerText) // ট্যাগের ভিতরের লেখা দেখার জন্য

    document.getElementById('country') // স্পেসিফিক আইডিকে ধরার জন্য।
