<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <p id="counts"></p>

  <div class="container">

    <div class="card">
      <img src="https://picsum.photos/300/200?1" alt="">
      <div class="content">
        <h3 class="cardsName">HTML</h3>
        <p>Learn structure of website.</p>
        <p class="price">7</p>
        <button class="btn">Click Me</button>
      </div>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/200?2" alt="">
      <div class="content">
        <h3 class="cardsName">CSS</h3>
        <p>Design your website beautifully.</p>
        <p class="price">9</p>
        <button class="btn">Click Me</button>
      </div>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/200?3" alt="">
      <div class="content">
        <h3 class="cardsName">JavaScript</h3>
        <p>Make your website interactive.</p>
        <p class="price">9</p>
        <button class="btn">Click Me</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
